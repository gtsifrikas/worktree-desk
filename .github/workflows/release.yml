name: Release macOS App

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    env:
      APP_NAME: WorktreeDesk
      BUNDLE_ID: com.gtsifrikas.worktreedesk
      CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
      CODESIGN_CERT_P12: ${{ secrets.MACOS_CODESIGN_CERT_P12 }}
      CODESIGN_CERT_PASSWORD: ${{ secrets.MACOS_CODESIGN_CERT_P12_PASSWORD }}
      NOTARIZE_APPLE_ID: ${{ secrets.MACOS_NOTARIZE_APPLE_ID }}
      NOTARIZE_TEAM_ID: ${{ secrets.MACOS_NOTARIZE_TEAM_ID }}
      NOTARIZE_APP_PASSWORD: ${{ secrets.MACOS_NOTARIZE_APP_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Ensure icon scripts are executable
        run: chmod +x scripts/build_app_icon.sh scripts/generate_app_icon.swift

      - name: Build release binary
        run: swift build -c release

      - name: Build app icon
        run: ./scripts/build_app_icon.sh

      - name: Package app bundle
        id: package
        run: |
          set -euo pipefail

          VERSION="0.1.${GITHUB_RUN_NUMBER}"
          DIST_DIR="${RUNNER_TEMP}/dist"
          APP_BUNDLE="${DIST_DIR}/${APP_NAME}.app"
          ZIP_PATH="${DIST_DIR}/${APP_NAME}-macOS.zip"
          SHA_PATH="${DIST_DIR}/${APP_NAME}-macOS.zip.sha256"

          mkdir -p "${APP_BUNDLE}/Contents/MacOS"
          mkdir -p "${APP_BUNDLE}/Contents/Resources"

          BINARY_PATH=""
          for candidate in \
            ".build/arm64-apple-macosx/release/${APP_NAME}" \
            ".build/x86_64-apple-macosx/release/${APP_NAME}"; do
            if [[ -x "${candidate}" ]]; then
              BINARY_PATH="${candidate}"
              break
            fi
          done

          if [[ -z "${BINARY_PATH}" ]]; then
            BINARY_PATH="$(find .build -type f -path "*/release/${APP_NAME}" -print -quit)"
          fi

          if [[ -z "${BINARY_PATH}" || ! -x "${BINARY_PATH}" ]]; then
            echo "Could not locate release binary for ${APP_NAME}."
            exit 1
          fi

          cp "${BINARY_PATH}" "${APP_BUNDLE}/Contents/MacOS/${APP_NAME}"
          chmod +x "${APP_BUNDLE}/Contents/MacOS/${APP_NAME}"
          cp "assets/AppIcon.icns" "${APP_BUNDLE}/Contents/Resources/AppIcon.icns"

          cat > "${APP_BUNDLE}/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>en</string>
            <key>CFBundleExecutable</key>
            <string>${APP_NAME}</string>
            <key>CFBundleIconFile</key>
            <string>AppIcon</string>
            <key>CFBundleIdentifier</key>
            <string>${BUNDLE_ID}</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>${APP_NAME}</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>${VERSION}</string>
            <key>CFBundleVersion</key>
            <string>${VERSION}</string>
            <key>LSMinimumSystemVersion</key>
            <string>14.0</string>
            <key>NSPrincipalClass</key>
            <string>NSApplication</string>
          </dict>
          </plist>
          PLIST

          printf "app_bundle=%s\n" "${APP_BUNDLE}" >> "${GITHUB_OUTPUT}"
          printf "zip_path=%s\n" "${ZIP_PATH}" >> "${GITHUB_OUTPUT}"
          printf "sha_path=%s\n" "${SHA_PATH}" >> "${GITHUB_OUTPUT}"

      - name: Detect signing configuration
        id: signing
        run: |
          set -euo pipefail

          echo "CODESIGN_CERT_P12 length: ${#CODESIGN_CERT_P12}"
          echo "CODESIGN_CERT_PASSWORD length: ${#CODESIGN_CERT_PASSWORD}"

          if [[ -n "${CODESIGN_IDENTITY}" && -n "${CODESIGN_CERT_P12}" && -n "${CODESIGN_CERT_PASSWORD}" ]]; then
            echo "sign_enabled=true" >> "${GITHUB_OUTPUT}"
            echo "Code signing is enabled."
          else
            echo "sign_enabled=false" >> "${GITHUB_OUTPUT}"
            echo "::warning::Missing code-signing secrets. Release will be unsigned and may be blocked by Gatekeeper."
          fi

          if [[ -n "${NOTARIZE_APPLE_ID}" && -n "${NOTARIZE_TEAM_ID}" && -n "${NOTARIZE_APP_PASSWORD}" ]]; then
            echo "notarize_enabled=true" >> "${GITHUB_OUTPUT}"
            echo "Notarization is enabled."
          else
            echo "notarize_enabled=false" >> "${GITHUB_OUTPUT}"
            echo "::warning::Missing notarization secrets. Release will be signed (if available) but not notarized."
          fi

      - name: Import Developer ID certificate
        if: steps.signing.outputs.sign_enabled == 'true'
        run: |
          set -euo pipefail

          KEYCHAIN_PATH="${RUNNER_TEMP}/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT_PATH="${RUNNER_TEMP}/developer_id.p12"

          CERT_B64="$(printf "%s" "${CODESIGN_CERT_P12}" | tr -d '\r\n')"
          if [[ -z "${CERT_B64}" ]]; then
            echo "Certificate secret is empty after trimming line endings."
            exit 1
          fi

          (printf "%s" "${CERT_B64}" | base64 --decode > "${CERT_PATH}") || (printf "%s" "${CERT_B64}" | base64 -D > "${CERT_PATH}")
          if [[ ! -s "${CERT_PATH}" ]]; then
            echo "Decoded certificate is empty (base64 length: ${#CERT_B64})."
            exit 1
          fi

          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security import "${CERT_PATH}" -f pkcs12 -k "${KEYCHAIN_PATH}" -P "${CODESIGN_CERT_PASSWORD}" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "${KEYCHAIN_PATH}" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"

      - name: Code sign app bundle
        if: steps.signing.outputs.sign_enabled == 'true'
        run: |
          set -euo pipefail

          APP_BUNDLE="${{ steps.package.outputs.app_bundle }}"
          codesign --force --deep --options runtime --timestamp --sign "${CODESIGN_IDENTITY}" "${APP_BUNDLE}"
          codesign --verify --deep --strict --verbose=2 "${APP_BUNDLE}"

      - name: Notarize app bundle
        if: steps.signing.outputs.sign_enabled == 'true' && steps.signing.outputs.notarize_enabled == 'true'
        run: |
          set -euo pipefail

          APP_BUNDLE="${{ steps.package.outputs.app_bundle }}"
          NOTARY_ZIP="${RUNNER_TEMP}/${APP_NAME}-notary.zip"

          ditto -c -k --sequesterRsrc --keepParent "${APP_BUNDLE}" "${NOTARY_ZIP}"
          xcrun notarytool submit "${NOTARY_ZIP}" \
            --apple-id "${NOTARIZE_APPLE_ID}" \
            --password "${NOTARIZE_APP_PASSWORD}" \
            --team-id "${NOTARIZE_TEAM_ID}" \
            --wait
          xcrun stapler staple "${APP_BUNDLE}"

      - name: Create release archive
        id: archive
        run: |
          set -euo pipefail

          APP_BUNDLE="${{ steps.package.outputs.app_bundle }}"
          ZIP_PATH="${{ steps.package.outputs.zip_path }}"
          SHA_PATH="${{ steps.package.outputs.sha_path }}"

          ditto -c -k --sequesterRsrc --keepParent "${APP_BUNDLE}" "${ZIP_PATH}"
          shasum -a 256 "${ZIP_PATH}" > "${SHA_PATH}"

          printf "zip_path=%s\n" "${ZIP_PATH}" >> "${GITHUB_OUTPUT}"
          printf "sha_path=%s\n" "${SHA_PATH}" >> "${GITHUB_OUTPUT}"

      - name: Build release metadata
        id: meta
        run: |
          TAG="main-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          NAME="WorktreeDesk ${TAG}"
          printf "tag=%s\n" "${TAG}" >> "${GITHUB_OUTPUT}"
          printf "name=%s\n" "${NAME}" >> "${GITHUB_OUTPUT}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          generate_release_notes: true
          files: |
            ${{ steps.archive.outputs.zip_path }}
            ${{ steps.archive.outputs.sha_path }}
